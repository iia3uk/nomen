[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nomen"
version = "5.0.0"
description = "Production-grade brand discovery engine for software products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "tenacity>=8.3,<10",
  "orjson>=3.10,<4",
  "rapidfuzz>=3.9,<4",
  "diskcache>=5.6,<6",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "numpy>=1.26,<3",
  "metaphone>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/iia3uk/nomen"
Repository = "https://github.com/iia3uk/nomen"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-asyncio>=0.23,<2",
]
embeddings = ["sentence-transformers>=3.0,<6"]
unix = ["uvloop>=0.19,<1"]

[project.scripts]
nomen = "nomen.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["nomen*"]

[tool.setuptools.package-data]
nomen = ["data/*.txt", "data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
